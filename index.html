<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Chatbot MAI</title>
        <link rel="stylesheet" href="App/Frontend/src/index.css">
    </head>
    <body>
        <div id="resultado"></div>
        <script>
            fetch('/contenido')
            .then(response => response.text())
            .then(html => {
                document.getElementById('resultado').innerHTML = html;
            });
        </script>
    </body>
</html>
